<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Chat v2 - index</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family:
  "Yu Gothic",
  "Hiragino Kaku Gothic ProN",
  "Noto Sans JP",
  sans-serif;
font-weight: 500;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  color: #333333;
}

#login, #chat { flex: 1; display: flex; flex-direction: column; }
#chat { display: none; }

.system { color: gray; }
.system.girl { color: red; font-weight: bold; }
.system.boy { color: blue; font-weight: bold; }

#controls {
  display: flex;
  gap: 8px;
  padding: 8px;
  position: sticky;
  top: 0;
  background: #ffffff;
  border: 1px solid #cfe8d5;
  border-radius: 8px;
  z-index: 10;
  align-items: center;
}

#controls input {
  flex: 1;
  min-width: 0;
}

input, button, select { padding: 10px; font-size: 16px; }
#punishWrap {
  gap: 20px;   /* ボタン同士の間隔 */

  position: absolute;
  bottom: 100%;
  left: 0;
  right: 0;

  background: #fff;
  padding: 8px;
  z-index: 200;
}
#punishWrap button {
  padding: 6px 12px;  /* ボタンの中の余白 */
  font-size: 16px;   /* 文字サイズ */
}


#userList {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: #ffffff;
  border: 1px solid #cfe8d5;
  border-radius: 8px;
  padding: 8px;
  list-style: none;
  align-items: center;
}

#userList li {
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
  font-size: 12px;
}


#settings {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: wrap;
  padding: 5px;
  background: #f9f9f9;
  border-bottom: 1px solid #ccc;
}
#settings input, #settings button, #settings select { padding: 5px; font-size: 14px; }

#messages {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 12px;
  list-style: none;
  padding-bottom: 260px;
  background: #ffffff;
  border-left: 1px solid #cfe8d5;
  border-right: 1px solid #cfe8d5;
}
#messages li {
  margin-bottom: 7px;
  padding: 6px 8px;
  border: 1px solid #e2f1e5;
  border-radius: 6px;
  background: #ffffff;
  white-space: pre-wrap;
}
input,
button,
select {
  border: 1px solid #cfe8d5;
  border-radius: 6px;
  background: #ffffff;
}

button {
  cursor: pointer;
}

button:hover {
  background: #f0faf2;
}
.private { background: #fff3cd; padding: 3px 6px; border-radius: 4px; }

.time { opacity: .6; margin-right: 4px; }

#bottomUI {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffffff;
  border-top: 1px solid #cfe8d5;
  border-radius: 10px 10px 0 0;
  padding: 8px;
  z-index: 100;
}

#timerPunishRow {
  position: relative;
}

</style>
</head>
<body>

<div id="login">
  <h2>チャット</h2>

<div id="roomInfo"
     style="margin-bottom:10px; color:#555;">
</div>

<div id="roomMembers"

  <input id="nameInput"

  </div>

</div>

<div id="chat">
 <div id="controls">
  <input id="input" placeholder="メッセージ">

  <span id="roomLabel"

  </span>
</div>


<!-- ===== 参加者 ===== -->
<div style="
  display:flex;

  flex-wrap:wrap;

</div>

<div id="settings">

    <label>色:
      <select id="colorPreset">
        <option value="">プリセット</option>
        <option value="#000000">黒</option>
        <option value="#cc0000">赤</option>
        <option value="#0066ff">青</option>

  </div>
  <div id="instructionSettings" style="

">

  <label>

  </label>

  </label>

</div>

</div>

<ul id="messages"></ul>



<div id="bottomUI">

    <button type="button" id="punishToggleBtn">
      メニュー
    </button>

    <button type="button" id="timerToggleBtn">
      タイマー
    </button>

    <button type="button" id="metronomeToggleBtn">
     メトロノーム
    </button>

    <div id="metronomeWrap" style="
  display:none;

">

    </div>

    <div id="diceRow" style="
      display:none;
    ">

      <button onclick="sendDice('2d6')">S</button>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ["websocket"],
  upgrade: false
});


const login = document.getElementById("login");
const chat = document.getElementById("chat");
const joinBtn = document.getElementById("joinBtn");
const nameInput = document.getElementById("nameInput");
const roomInfo = document.getElementById("roomInfo");

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const leaveBtn = document.getElementById("leaveBtn");

const settingsBtn =
  document.getElementById("settingsBtn");

const instructionSettings =
  document.getElementById("instructionSettings");

if (settingsBtn && instructionSettings){
  settingsBtn.onclick = () => {

    instructionSettings.style.display =
      instructionSettings.style.display === "none"
        ? "block"
        : "none";

  };
}
const instructionChecks =
  document.querySelectorAll(
    'input[name="instructionType"]'
  );

const instructionDrawBtn =
  document.getElementById("instructionDrawBtn");

if (instructionDrawBtn){
  instructionDrawBtn.onclick = () => {

    if (instructionDrawBtn.disabled) return;

instructionDrawBtn.disabled = true;

setTimeout(() => {
  instructionDrawBtn.disabled = false;
}, 3000);

    const selectedTypes =
      Array.from(instructionChecks)
        .filter(check => check.checked)
        .map(check => check.value);

    if (selectedTypes.length === 0){
      alert("指示を1つ以上選択してください");
      return;
    }

    socket.emit("instructionDraw", {
      types: selectedTypes
    });

  };
}

const instructionStorageKey =
  `instructionTypes_${localStorage.getItem("chatRoom") || "room1"}`;

const savedInstructionTypes =
  JSON.parse(
  localStorage.getItem(instructionStorageKey) || "null"
  );

if (savedInstructionTypes){
  instructionChecks.forEach(check => {
    check.checked =
      savedInstructionTypes.includes(check.value);
  });
}  

instructionChecks.forEach(check => {
  check.addEventListener("change", () => {

    const selected =
      Array.from(instructionChecks)
        .filter(item => item.checked)
        .map(item => item.value);

    localStorage.setItem(
  instructionStorageKey,
  JSON.stringify(selected)
);

  });
});  

const userList = document.getElementById("userList");
const colorSelect = document.getElementById("colorSelect");
const privateTarget = document.getElementById("privateTarget");

let username = "";
let myColor = "#000000";
let privateTo = "";
let joined = false;

let connectKey =
  localStorage.getItem("connectKey");

if (!connectKey){

  connectKey =
    Math.random().toString(36).slice(2) +
    Date.now().toString(36);

  localStorage.setItem(
    "connectKey",
    connectKey
  );
}


window.addEventListener("load", () => {

  const savedName  = localStorage.getItem(`chatName_${room}`);
  const savedRoom = room;
  socket.emit("viewRoom", room);
  console.log("保存データ", savedName, savedRoom);
  const savedColor = localStorage.getItem("chatColor") || "#000000";

  const normalTimerCustomBtn =
    document.getElementById("timerCustomBtn");

  const normalTimerCustomInput =
    document.getElementById("timerCustomInput");

  if (normalTimerCustomBtn){

    normalTimerCustomBtn.onclick = () => {

      const min =
        parseInt(normalTimerCustomInput.value);

      if (!min || min <= 0) return;

      socket.emit("timerStart", {
        seconds: min * 60
      });

      normalTimerCustomInput.value = "";

    };

  }

  if (savedName && savedRoom) {
 
    username = savedName;
    myColor = savedColor;
    colorSelect.value = myColor;

    socket.emit("join", {
  name: username,
  color: myColor,
  room,
  connectKey: localStorage.getItem("connectKey"),
  isAdmin: localStorage.getItem("isAdmin") === "true"
});


    joined = true;

        // ===== 初回確認済みならチェック非表示 =====
    const confirmed =
      localStorage.getItem(
        "entryConfirmed"
      );

    if (confirmed){
      const loginDiv =
        document.getElementById("login");

      if (loginDiv){
        loginDiv.style.display =
          "none";
      }
    }

    login.style.display = "none";
    chat.style.display = "flex";
  }
});

/* ===== URLから部屋を決定 ===== */
const path = location.pathname;

const room =
  path === "/room2" ? "room2" :
  path === "/room3" ? "room3" :
  "room1";

// ===== ダイス表示制御 =====
const diceRow =
  document.getElementById("diceRow");

const showDiceRooms = [
  "room1",
  "room2",
  "room3",
  "room4",
  "room5",
  "room6"
];

if (diceRow){
  diceRow.style.display = "none";
}




const roomNames = {
  room1: "ルーム1",
  room2: "ルーム2",
  room3: "ルーム3",
  room4: "ルーム4",
  room5: "女子部屋",
  room6: "巻き込み",   // ← 追加
  denki: "電気1",
  denki1: "電気椅2",
  denki2: "電気3",
  special: "スペシャル",
  privateA: "個室A",
  privateB: "個室B",
  privateC: "個室C",
  privateD: "個室D"
};


const roomLabel = document.getElementById("roomLabel");

if (roomLabel && room) {
  roomLabel.textContent = `${roomNames[room] || room}`;
}

// ===== 女子部屋制御 =====
if (room === "room5") {

  const boyPunishBtn =
    document.getElementById("boyPunishBtn");

  const boyOnaBtn =
    document.getElementById("boyOnaBtn");

  if (boyPunishBtn){
    boyPunishBtn.style.display = "none";
  }

  if (boyOnaBtn){
    boyOnaBtn.style.display = "none";
  }

}
// ===== 苦痛罰表示制御 =====
const painPunishBtn =
  document.getElementById("painPunishBtn");

if (painPunishBtn){

  if (
    room === "special" ||
    room === "denki"  ||
    room === "denki1" ||
    room === "denki2"
  ){
    painPunishBtn.style.display =
      "inline-block";
  }
  else{
    painPunishBtn.style.display =
      "none";
  }

}

// ===== room2・room3 メニュー制御 =====
if (room === "room2" || room === "room3") {

  const instructionBtn =
    document.getElementById("instructionDrawBtn");

  const toyBtn =
    document.querySelector("button[onclick=\"sendPunish('玩具用')\"]");

  const girlBtn =
    document.querySelector("button[onclick=\"sendPunish('命令女')\"]");

  const boyBtn =
    document.querySelector("button[onclick=\"sendPunish('命令男')\"]");

  const partyBtn =
    document.querySelector("button[onclick=\"sendPunish('パーティー')\"]");

  const painBtn =
    document.getElementById("painPunishBtn");

  const zecchoBtn =
    document.getElementById("zecchoBtn");

  if (instructionBtn) instructionBtn.style.display = "none";
  if (toyBtn)         toyBtn.style.display = "none";
  if (girlBtn)        girlBtn.style.display = "none";
  if (boyBtn)         boyBtn.style.display = "none";
  if (partyBtn)       partyBtn.style.display = "none";
  if (painBtn)        painBtn.style.display = "none";
  if (zecchoBtn)      zecchoBtn.style.display = "none";

  if (room === "room2" && instructionBtn) {
    instructionBtn.style.display = "inline-block";
  }

  if (room === "room3" && toyBtn) {
    toyBtn.style.display = "inline-block";
  }

}

// ===== ルーム6制御（イベントボタン表示） =====
if (room === "room6") {

  const punishWrap =
    document.getElementById("punishWrap");

  const maleEventBtn =
    document.getElementById("maleEventBtn");

  const femaleEventBtn =
    document.getElementById("femaleEventBtn");

  const commonEventBtn =
    document.getElementById("commonEventBtn");

  if (punishWrap){
    punishWrap.style.display = "flex";
  }

  if (maleEventBtn){
    maleEventBtn.style.display = "inline-block";
  }

  if (femaleEventBtn){
    femaleEventBtn.style.display = "inline-block";
  }

  if (commonEventBtn){
    commonEventBtn.style.display = "inline-block";
  }

  const girlPunishBtn =
    document.querySelector("button[onclick=\"sendPunish('女子罰')\"]");

  const boyPunishBtn =
    document.getElementById("boyPunishBtn");

  const girlOnaBtn =
    document.querySelector("button[onclick=\"sendPunish('命令女')\"]");

  const boyOnaBtn =
    document.getElementById("boyOnaBtn");

  const painBtn =
    document.querySelector("button[onclick=\"sendPunish('苦痛罰')\"]");

  if (girlPunishBtn) girlPunishBtn.style.display = "none";
  if (boyPunishBtn) boyPunishBtn.style.display = "none";
  if (girlOnaBtn)   girlOnaBtn.style.display = "none";
  if (boyOnaBtn)    boyOnaBtn.style.display = "none";
  if (painBtn)      painBtn.style.display = "none";

}

// ===== スペシャル制御（罰は残してイベントだけ追加） =====
if (room === "special") {

  const maleEventBtn =
    document.getElementById("maleEventBtn");

  const femaleEventBtn =
    document.getElementById("femaleEventBtn");

  const commonEventBtn =
    document.getElementById("commonEventBtn");

  if (maleEventBtn){
    maleEventBtn.style.display = "inline-block";
  }

  if (femaleEventBtn){
    femaleEventBtn.style.display = "inline-block";
  }

  if (commonEventBtn){
    commonEventBtn.style.display = "inline-block";
  }

}



const key = localStorage.getItem("chatKey");




/* ===== 表示 ===== */
function renderMsg(d) {
  const li = document.createElement("li");

  if (d.time) {
    const t = document.createElement("span");
    t.textContent = `[${d.time}] `;
    t.className = "time";
    li.appendChild(t);
  }

  const text = document.createElement("span");
if (d.private) {
  const toName = d.toName || "相手";

  const formattedText =
    d.text.replace(/\n/g, "<br>");

  text.innerHTML =
    `【内緒】${d.name} ▶ ${toName}: ${formattedText}`;

  li.classList.add("private");
} else {
  const formattedText =
  d.text.replace(/\n/g, "<br>");

text.innerHTML =
  `${d.name}: ${formattedText}`;
}

 li.appendChild(text);
li.style.color = d.color || "#000";

if (d.bold) {
  text.style.fontWeight = "bold";
}

messages.prepend(li);

}

/* ===== 受信 ===== */
let myId; // 初期化追加
socket.on("connect", () => {

  myId = socket.id;


});

socket.on("pastMessages", logs => {

  messages.innerHTML = "";
  logs.forEach(renderMsg);

  // ===== 絶頂解放ログ判定 =====
  const unlocked = logs.some(m =>
    m.text?.includes("絶頂許可が解放されました")
  );

  if (unlocked){
    const btn = document.getElementById("zecchoBtn");
    if (btn) btn.style.display = "inline-block";
  }

});

// ===== 個人ミュート管理 =====
let myMutes = [];

// server から同期（後で拡張用）
socket.on("muteSync", list => {
  myMutes = list || [];
});

socket.on("message", d => {

// ===== ミュート遮断 =====
if (d.name && myMutes.includes(d.name)) {
  return;
}


  // ===== 内緒表示制御 =====
  if (d.private) {
    if (d.to !== myId && d.name !== username) return;
  }



  renderMsg(d);

});

socket.on("zecchoUnlock", () => {

  const btn = document.getElementById("zecchoBtn");

  if (btn){
    btn.style.display = "inline-block";

    btn.style.backgroundColor = "black";
    btn.style.color = "white";
  }

});


socket.on("orgasmUsed", () => {
  const btn = document.getElementById("zecchoBtn");
  if (btn) btn.style.display = "none";
});

socket.on("zecchoHide", () => {
  const btn = document.getElementById("zecchoBtn");
  if (btn) btn.style.display = "none";
});

// ===== タイマー同期 =====
let timerInterval = null;

socket.on("timerSync", ({ endTime }) => {


  const display =
    document.getElementById("timerDisplay");

  if (!display) return;

  display.style.display = "block";

  if (timerInterval){
    clearInterval(timerInterval);
  }


  timerInterval = setInterval(() => {

    const remain =
      Math.max(0, endTime - Date.now());

    const sec =
      Math.floor(remain / 1000);

    const m =
      String(Math.floor(sec / 60))
        .padStart(2,"0");

    const s =
      String(sec % 60)
        .padStart(2,"0");

    display.textContent =
      `⏱ ${m}:${s}`;

    if (remain <= 0){
      clearInterval(timerInterval);
    }

  }, 1000);

});

      "true"
    );

  username = nameInput.value.trim();

  localStorage.setItem("chatRoom", room);

  socket.emit("join", {
  name: username,
  color: myColor,
  room,
  key,
  connectKey,
  isAdmin: localStorage.getItem("isAdmin") === "true"
});


  joined = true;
  login.style.display = "none";

};

function startMetronome(bpm) {

  if (!Number.isFinite(bpm) || bpm <= 0) return;

  startMetroBeat(bpm);

}

// ===== メトロノーム拍表示 =====

let metroBeatTimer = null;
let metroBeat = 1;

function stopMetroBeat() {
  if (metroBeatTimer) {
    clearInterval(metroBeatTimer);
    metroBeatTimer = null;
  }

  const display =
    document.getElementById("metroBeatDisplay");

  if (display) {
    display.style.display = "none";
  }
}

function startMetroBeat(bpm) {

  bpm = Number(bpm);

  if (!Number.isFinite(bpm) || bpm <= 0) return;

  if (metroBeatTimer) {
    clearInterval(metroBeatTimer);
  }

  const display =
    document.getElementById("metroBeatDisplay");

  if (!display) return;

  display.style.display = "block";
  metroBeat = 1;

  display.textContent = "① ② ③";

  function updateBeat() {

    const marks = ["①", "②", "③"];

    display.innerHTML =
  marks.map((mark, index) =>
    index === metroBeat - 1
      ? `<span style="font-size:32px; font-weight:bold;">${mark}</span>`
      : `<span style="font-size:24px; opacity:0.4;">${mark}</span>`
  ).join(" ");

    metroBeat++;

    if (metroBeat > 3) {
      metroBeat = 1;
    }

  }

  updateBeat();

  metroBeatTimer =
    setInterval(updateBeat, 60000 / bpm);
}
