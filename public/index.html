<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Chat v2 - index</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family:
  "Yu Gothic",
  "Hiragino Kaku Gothic ProN",
  "Noto Sans JP",
  sans-serif;
font-weight: 500;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  color: #333333;
}

#login, #chat { flex: 1; display: flex; flex-direction: column; }
#chat { display: none; }

.system { color: gray; }
.system.girl { color: red; font-weight: bold; }
.system.boy { color: blue; font-weight: bold; }

#controls {
  display: flex;
  gap: 8px;
  padding: 8px;
  position: sticky;
  top: 0;
  background: #ffffff;
  border: 1px solid #cfe8d5;
  border-radius: 8px;
  z-index: 10;
  align-items: center;
}

#controls input {
  flex: 1;
  min-width: 0;
}

input, button, select { padding: 10px; font-size: 16px; }
#punishWrap {
  gap: 20px;   /* ボタン同士の間隔 */

  position: absolute;
  bottom: 100%;
  left: 0;
  right: 0;

  background: #fff;
  padding: 8px;
  z-index: 200;
}
#punishWrap button {
  padding: 6px 12px;  /* ボタンの中の余白 */
  font-size: 16px;   /* 文字サイズ */
}


#userList {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: #ffffff;
  border: 1px solid #cfe8d5;
  border-radius: 8px;
  padding: 8px;
  list-style: none;
  align-items: center;
}

#userList li {
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
}


#settings { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; padding: 5px; background: #f9f9f9; border-bottom: 1px solid #ccc; }
#settings input, #settings button, #settings select { padding: 5px; font-size: 14px; }

#messages {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 12px;
  list-style: none;
  padding-bottom: 260px;
  background: #ffffff;
  border-left: 1px solid #cfe8d5;
  border-right: 1px solid #cfe8d5;
}
#messages li {
  margin-bottom: 7px;
  padding: 6px 8px;
  border: 1px solid #e2f1e5;
  border-radius: 6px;
  background: #ffffff;
  white-space: pre-wrap;
}
input,
button,
select {
  border: 1px solid #cfe8d5;
  border-radius: 6px;
  background: #ffffff;
}

button {
  cursor: pointer;
}

button:hover {
  background: #f0faf2;
}
.private { background: #fff3cd; padding: 3px 6px; border-radius: 4px; }

.time { opacity: .6; margin-right: 4px; }

#bottomUI {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffffff;
  border-top: 1px solid #cfe8d5;
  border-radius: 10px 10px 0 0;
  padding: 8px;
  z-index: 100;
}

</style>
</head>
<body>

<div id="login">
  <h2>チャット</h2>

  <div id="roomInfo"
       style="margin-bottom:10px; color:#555;">
  </div>



  <input id="nameInput"
         placeholder="名前">

  <!-- ===== 確認チェック ===== -->
  <div style="
    margin-top:12px;
    font-size:14px;
    line-height:1.6;
  ">

    <label>
      <input type="checkbox"
             id="confirmAge">
      18歳未満の利用は禁止です
    </label>
    <br>

    <label>
      <input type="checkbox"
             id="confirmRule">
      ルール・禁止事項を確認しました
    </label>
    <br>


  </div>

  <button id="joinBtn"
          style="margin-top:12px;">
    入室
  </button>
</div>

<div id="chat">
 <div id="controls">
  <input id="input" placeholder="メッセージ">
  <button id="sendBtn">送信</button>

  <span id="roomLabel"
    style="padding:10px; font-weight:bold;">
  </span>
</div>


<!-- ===== 参加者 ===== -->
<div style="
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:6px 8px;
  background:#ffffff;
  border:1px solid #cfe8d5;
  border-radius:8px;
  margin:4px 0;
">
  <strong>参加者:</strong>
  <ul id="userList"></ul>
</div>



<div id="bottomUI">

<!-- ===== タイマー＋罰トグル横並び ===== -->
<div id="timerPunishRow" style="
  display:flex;
  gap:8px;
  padding:4px 0;
  flex-wrap:wrap;
">

  <!-- 罰トグル -->
  <button id="punishToggleBtn">
    メニュー
  </button>

  <!-- タイマー -->
  <button id="timer3Btn">3分</button>
  <button id="timer5Btn">5分</button>
  <input id="timerCustomInput"
  type="number"
  min="1"
  step="1"
  placeholder="分"
  style="width:60px;">

<button id="timerCustomBtn">
  任意
</button>


</div>

<!-- ===== 罰ボタン本体 ===== -->
<div id="punishWrap" style="
  display:none;
  gap:7px;
  flex-wrap:wrap;
  padding:6px 0;
">

  <button onclick="sendPunish('女子罰')">女子用</button>

  <button id="boyPunishBtn"
    onclick="sendPunish('男子罰')">
    男子用
  </button>

  <button onclick="sendPunish('命令女')">未実装</button>

  <button id="boyOnaBtn"
    onclick="sendPunish('命令男')">
    未実装
  </button>

  <button id="painPunishBtn"
    onclick="sendPunish('苦痛罰')">
    苦痛罰
  </button>

  <button id="zecchoBtn"
    onclick="sendPunish('絶頂許可')"
    style="display:none;">
    絶頂許可
  </button>

  <button id="maleEventBtn"
  style="display:none;"
  onclick="socket.emit('room6Event',{ type:'boy' })">
  男イベント
</button>

  <button id="femaleEventBtn"
    style="display:none;"
    onclick="socket.emit('room6Event',{ type:'girl' })">
    女イベント
  </button>

  <button id="commonEventBtn"
    style="display:none;"
    onclick="socket.emit('room6Event',{ type:'common' })">
    共通イベント
  </button>

</div>

<!-- ===== ダイスボタンRow ===== -->
<div id="diceRow" style="
  display:none;
">

  <button onclick="sendDice('2d6')">S</button>
  <button onclick="sendDice('2d5')">N</button>
  <button onclick="sendDice('2d4')">M</button>

</div>

</div>

<div id="timerDisplay"
     style="
       font-weight:bold;
       padding:4px 0;
       display:none;">
  ⏱ 00:00
</div>

<div id="settings">

    <label>色:
<select id="colorPreset">
<option value="">プリセット</option>
<option value="#000000">黒</option>
<option value="#cc0000">赤</option>
<option value="#0066ff">青</option>
<option value="#008800">緑</option>
<option value="#8000cc">紫</option>
<option value="#ff6600">オレンジ</option>
<option value="#ff1493">ピンク</option>
<option value="#8b4513">茶色</option>
<option value="#003366">紺</option>
<option value="#555555">グレー</option>
</select>

<input type="color" id="colorSelect" value="#000000">
</label>
    <label>内緒:
      <select id="privateTarget">
        <option value="">なし</option>
      </select>
    </label>
    <label>
      音:
      <select id="soundSelect">
        <option value="off">OFF</option>
        <option value="small">小</option>
        <option value="medium">中</option>
        <option value="large">大</option>
      </select>
    </label>
    <button id="leaveBtn">退出</button>
  </div>


  <ul id="messages"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const login = document.getElementById("login");
const chat = document.getElementById("chat");
const joinBtn = document.getElementById("joinBtn");
const nameInput = document.getElementById("nameInput");
const roomInfo = document.getElementById("roomInfo");

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const leaveBtn = document.getElementById("leaveBtn");
const userList = document.getElementById("userList");
const colorSelect = document.getElementById("colorSelect");
const privateTarget = document.getElementById("privateTarget");
const soundSelect = document.getElementById("soundSelect");

const notifySound = new Audio("/notify.mp3");
const SOUND_LEVELS = { off:0, small:0.2, medium:0.5, large:1.0 };
let soundLevel = localStorage.getItem("soundLevel") || "off";
soundSelect.value = soundLevel;

let username = "";
let myColor = "#000000";
let privateTo = "";
let joined = false;

let connectKey =
  localStorage.getItem("connectKey");

if (!connectKey){

  connectKey =
    Math.random().toString(36).slice(2) +
    Date.now().toString(36);

  localStorage.setItem(
    "connectKey",
    connectKey
  );
}


window.addEventListener("load", () => {

  const savedName  = localStorage.getItem("chatName");
  const savedRoom  = localStorage.getItem("chatRoom");
  const savedColor = localStorage.getItem("chatColor") || "#000000";

  const normalTimerCustomBtn =
    document.getElementById("timerCustomBtn");

  const normalTimerCustomInput =
    document.getElementById("timerCustomInput");

  if (normalTimerCustomBtn){

    normalTimerCustomBtn.onclick = () => {

      const min =
        parseInt(normalTimerCustomInput.value);

      if (!min || min <= 0) return;

      socket.emit("timerStart", {
        seconds: min * 60
      });

      normalTimerCustomInput.value = "";

    };

  }

  if (savedName && savedRoom) {
 
    username = savedName;
    myColor = savedColor;
    colorSelect.value = myColor;

    socket.emit("join", {
  name: username,
  color: myColor,
  room: savedRoom,
  connectKey: localStorage.getItem("connectKey"),
  isAdmin: localStorage.getItem("isAdmin") === "true"
});


    joined = true;

        // ===== 初回確認済みならチェック非表示 =====
    const confirmed =
      localStorage.getItem(
        "entryConfirmed"
      );

    if (confirmed){
      const loginDiv =
        document.getElementById("login");

      if (loginDiv){
        loginDiv.style.display =
          "none";
      }
    }

    login.style.display = "none";
    chat.style.display = "flex";
  }
});

/* ===== ロビーからの情報 ===== */
const room = localStorage.getItem("chatRoom") || "room1";


// ===== ダイス表示制御 =====
const diceRow =
  document.getElementById("diceRow");

const showDiceRooms = [
  "room1",
  "room2",
  "room3",
  "room4",
  "room5",
  "room6"
];

if (diceRow){
  diceRow.style.display = "none";
}




const roomNames = {
  room1: "ルーム1",
  room2: "ルーム2",
  room3: "ルーム3",
  room4: "ルーム4",
  room5: "女子部屋",
  room6: "巻き込み",   // ← 追加
  denki: "電気1",
  denki1: "電気椅2",
  denki2: "電気3",
  special: "スペシャル",
  privateA: "個室A",
  privateB: "個室B",
  privateC: "個室C",
  privateD: "個室D"
};


const roomLabel = document.getElementById("roomLabel");

if (roomLabel && room) {
  roomLabel.textContent = `${roomNames[room] || room}`;
}

// ===== 女子部屋制御 =====
if (room === "room5") {

  const boyPunishBtn =
    document.getElementById("boyPunishBtn");

  const boyOnaBtn =
    document.getElementById("boyOnaBtn");

  if (boyPunishBtn){
    boyPunishBtn.style.display = "none";
  }

  if (boyOnaBtn){
    boyOnaBtn.style.display = "none";
  }

}
// ===== 苦痛罰表示制御 =====
const painPunishBtn =
  document.getElementById("painPunishBtn");

if (painPunishBtn){

  if (
    room === "special" ||
    room === "denki"  ||
    room === "denki1" ||
    room === "denki2"
  ){
    painPunishBtn.style.display =
      "inline-block";
  }
  else{
    painPunishBtn.style.display =
      "none";
  }

}


// ===== ルーム6制御（イベントボタン表示） =====
if (room === "room6") {

  const punishWrap =
    document.getElementById("punishWrap");

  const maleEventBtn =
    document.getElementById("maleEventBtn");

  const femaleEventBtn =
    document.getElementById("femaleEventBtn");

  const commonEventBtn =
    document.getElementById("commonEventBtn");

  if (punishWrap){
    punishWrap.style.display = "flex";
  }

  if (maleEventBtn){
    maleEventBtn.style.display = "inline-block";
  }

  if (femaleEventBtn){
    femaleEventBtn.style.display = "inline-block";
  }

  if (commonEventBtn){
    commonEventBtn.style.display = "inline-block";
  }

  const girlPunishBtn =
    document.querySelector("button[onclick=\"sendPunish('女子罰')\"]");

  const boyPunishBtn =
    document.getElementById("boyPunishBtn");

  const girlOnaBtn =
    document.querySelector("button[onclick=\"sendPunish('命令女')\"]");

  const boyOnaBtn =
    document.getElementById("boyOnaBtn");

  const painBtn =
    document.querySelector("button[onclick=\"sendPunish('苦痛罰')\"]");

  if (girlPunishBtn) girlPunishBtn.style.display = "none";
  if (boyPunishBtn) boyPunishBtn.style.display = "none";
  if (girlOnaBtn)   girlOnaBtn.style.display = "none";
  if (boyOnaBtn)    boyOnaBtn.style.display = "none";
  if (painBtn)      painBtn.style.display = "none";

}

// ===== スペシャル制御（罰は残してイベントだけ追加） =====
if (room === "special") {

  const maleEventBtn =
    document.getElementById("maleEventBtn");

  const femaleEventBtn =
    document.getElementById("femaleEventBtn");

  const commonEventBtn =
    document.getElementById("commonEventBtn");

  if (maleEventBtn){
    maleEventBtn.style.display = "inline-block";
  }

  if (femaleEventBtn){
    femaleEventBtn.style.display = "inline-block";
  }

  if (commonEventBtn){
    commonEventBtn.style.display = "inline-block";
  }

}



const key = localStorage.getItem("chatKey");




/* ===== 表示 ===== */
function renderMsg(d) {
  const li = document.createElement("li");

  if (d.time) {
    const t = document.createElement("span");
    t.textContent = `[${d.time}] `;
    t.className = "time";
    li.appendChild(t);
  }

  const text = document.createElement("span");
if (d.private) {
  const toName = d.toName || "相手";

  const formattedText =
    d.text.replace(/\n/g, "<br>");

  text.innerHTML =
    `【内緒】${d.name} ▶ ${toName}: ${formattedText}`;

  li.classList.add("private");
} else {
  const formattedText =
  d.text.replace(/\n/g, "<br>");

text.innerHTML =
  `${d.name}: ${formattedText}`;
}

 li.appendChild(text);
li.style.color = d.color || "#000";

if (d.bold) {
  text.style.fontWeight = "bold";
}

messages.prepend(li);

}

/* ===== 受信 ===== */
let myId; // 初期化追加
socket.on("connect", () => {

  myId = socket.id;


});

socket.on("pastMessages", logs => {

  messages.innerHTML = "";
  logs.forEach(renderMsg);

  // ===== 絶頂解放ログ判定 =====
  const unlocked = logs.some(m =>
    m.text?.includes("絶頂許可が解放されました")
  );

  if (unlocked){
    const btn = document.getElementById("zecchoBtn");
    if (btn) btn.style.display = "inline-block";
  }

});

// ===== 個人ミュート管理 =====
let myMutes = [];

// server から同期（後で拡張用）
socket.on("muteSync", list => {
  myMutes = list || [];
});

socket.on("message", d => {

// ===== ミュート遮断 =====
if (d.name && myMutes.includes(d.name)) {
  return;
}


  // ===== 内緒表示制御 =====
  if (d.private) {
    if (d.to !== myId && d.name !== username) return;
  }

  // ===== 通知音 =====
  if (
    soundLevel !== "off" &&
    d.name &&
    d.name !== username
  ) {
    notifySound.volume =
      SOUND_LEVELS[soundLevel];

    notifySound.currentTime = 0;
    notifySound.play().catch(()=>{});
  }

  renderMsg(d);

});

socket.on("zecchoUnlock", () => {

  const btn = document.getElementById("zecchoBtn");

  if (btn){
    btn.style.display = "inline-block";

    btn.style.backgroundColor = "black";
    btn.style.color = "white";
  }

});


socket.on("orgasmUsed", () => {
  const btn = document.getElementById("zecchoBtn");
  if (btn) btn.style.display = "none";
});

socket.on("zecchoHide", () => {
  const btn = document.getElementById("zecchoBtn");
  if (btn) btn.style.display = "none";
});

// ===== タイマー同期 =====
let timerInterval = null;

socket.on("timerSync", ({ endTime }) => {

  const display =
    document.getElementById("timerDisplay");

  if (!display) return;

  display.style.display = "block";

  if (timerInterval){
    clearInterval(timerInterval);
  }

  timerInterval = setInterval(() => {

    const remain =
      Math.max(0, endTime - Date.now());

    const sec =
      Math.floor(remain / 1000);

    const m =
      String(Math.floor(sec / 60))
        .padStart(2,"0");

    const s =
      String(sec % 60)
        .padStart(2,"0");

    display.textContent =
      `⏱ ${m}:${s}`;

    if (remain <= 0){
      clearInterval(timerInterval);
    }

  }, 1000);

});

// ===== タイマー終了 =====
socket.on("timerEnd", () => {

  const display =
    document.getElementById("timerDisplay");

  if (display){
    display.style.display = "none";
  }

  if (timerInterval){
    clearInterval(timerInterval);
  }

});

socket.on("zecchoHide", () => {

  const btn =
    document.getElementById("zecchoBtn");

  if (btn){
    btn.style.display = "none";
  }

});




socket.on("userList", list => {

  userList.innerHTML = "";
  privateTarget.innerHTML =
    `<option value="">なし</option>`;

  list.forEach(u => {

const li = document.createElement("li");

const nameSpan = document.createElement("span");

nameSpan.textContent =
  (u.isAdmin ? "👑" : "") + u.name;

nameSpan.style.color =
  u.color || "#000";

li.appendChild(nameSpan);

    // ===== 自分以外のみ操作ボタン =====
    if (u.id !== myId) {

      // 内緒用
      const opt =
        document.createElement("option");

      opt.value = u.id;
      opt.textContent = u.name;

      privateTarget.appendChild(opt);

    
   // ===== ミュートボタン =====
const muteBtn =
  document.createElement("button");

// 初期表示
if (myMutes.includes(u.name)) {
  muteBtn.textContent = "済";
} else {
  muteBtn.textContent = "消";
}

muteBtn.style.marginLeft = "6px";
muteBtn.style.padding = "2px 6px";
muteBtn.style.fontSize = "12px";
muteBtn.style.lineHeight = "1.2";

muteBtn.onclick = () => {

  socket.emit("muteUser", u.id);

  // 表示トグル
  if (muteBtn.textContent === "消") {
    muteBtn.textContent = "済";
  } else {
    muteBtn.textContent = "消";
  }

};


      li.appendChild(muteBtn);
    }

    userList.appendChild(li);

  });

});



/* ===== 入室処理 ===== */
joinBtn.onclick = () => {
  if (joined || !nameInput.value.trim()) return;

    // ===== 確認チェック判定 =====
  const ageCheck =
    document.getElementById("confirmAge");

  const ruleCheck =
    document.getElementById("confirmRule");


  const confirmed =
    localStorage.getItem(
      "entryConfirmed"
    );

  // 初回のみ必須
  if (!confirmed) {

    if (
      !ageCheck?.checked ||
      !ruleCheck?.checked 
    ){
      alert(
        "確認項目をすべてチェックしてください"
      );
      return;
    }

    localStorage.setItem(
      "entryConfirmed",
      "true"
    );
  }


  username = nameInput.value.trim();
  localStorage.setItem("chatName", username);

  socket.emit("join", {
  name: username,
  color: myColor,
  room,
  key,
  connectKey,
  isAdmin: localStorage.getItem("isAdmin") === "true"
});


  joined = true;
  login.style.display = "none";
  chat.style.display = "flex";
};

/* ===== 操作 ===== */
colorSelect.oninput = () => {
  myColor = colorSelect.value;
  localStorage.setItem("chatColor", myColor);
  socket.emit("updateColor", { color: myColor });
};

const colorPreset = document.getElementById("colorPreset");

colorPreset.onchange = () => {

  if (!colorPreset.value) return;

  myColor = colorPreset.value;

  colorSelect.value = myColor;

  localStorage.setItem("chatColor", myColor);

  socket.emit("updateColor", { color: myColor });

};

soundSelect.onchange = () => {
  soundLevel = soundSelect.value;
  localStorage.setItem("soundLevel", soundLevel);
};

privateTarget.onchange = () => {
  privateTo = privateTarget.value || "";
};

sendBtn.onclick = () => {
  if (!input.value.trim()) return;
  socket.emit("message", {
    text: input.value.trim(),
    color: myColor,
    to: privateTo || undefined
  });
  input.value = "";
  privateTo = "";
  privateTarget.value = "";
};

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

leaveBtn.onclick = () => {
  socket.emit("leave");
  localStorage.removeItem("chatName");
  localStorage.removeItem("chatRoom");
  localStorage.removeItem("chatKey");
 joined = false;
  chat.style.display = "none";
  login.style.display = "flex";
};
function sendPunish(cmd){
  socket.emit("message",{ text: cmd });
}
function sendDice(cmd){
  socket.emit("message",{ text: cmd });
}

 // ===== 罰トグル（通常） =====
const normalToggle =
  document.getElementById("punishToggleBtn");

const normalWrap =
  document.getElementById("punishWrap");

if (normalToggle && normalWrap){

  let open = false;

  normalToggle.onclick = () => {
    open = !open;
    normalWrap.style.display =
      open ? "flex" : "none";
  };

}

  
  
  // ===== タイマーボタン（通常と電気分離） =====

// 通常
const normalTimer3Btn =
  document.getElementById("timer3Btn");

const normalTimer5Btn =
  document.getElementById("timer5Btn");

if (normalTimer3Btn){
  normalTimer3Btn.onclick = () => {
    socket.emit("timerStart", { seconds: 180 });
  };
}
